document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

percase;color:#75A3CC\">Design system · Lib<\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;flex-direction:column;gap:22px\">\n      <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"padding:0 24px 8px;font-family:'Saira',sans-serif;font-weight:600;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#508BBF\">{{ g.name }}<\u002Fdiv>\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ it.onClick }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;border:0;background:{{ it.bg }};color:{{ it.color }};font-size:14px;font-weight:500;text-align:left;padding:9px 24px;cursor:pointer;border-left:2px solid {{ it.bar }}\" style-hover=\"background:#20293C;color:#E2F3FE\">{{ it.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;padding:{{ pad }};max-width:1240px\">\n\n    <sc-if value=\"{{ s_overview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:40px\">\n        <header style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Overview<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:48px;line-height:1.05;letter-spacing:.01em;color:#E2F3FE;text-transform:uppercase\">Cybnity design system<\u002Fh1>\n          <p style=\"margin:0;max-width:660px;font-size:16px;color:#BACFE2;text-wrap:pretty\">Foundations and components for the Cybnity cyber-defence application, transcribed from the <strong style=\"color:#E2F3FE;font-weight:600\">Lib<\u002Fstrong> page of the source Figma file. Dark surfaces, a single cyan primary, and a five-step alert ramp from calm to critical.<\u002Fp>\n        <\u002Fheader>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:#223544;border:1px solid #223544\">\n          <div style=\"background:#1D2535;padding:22px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Ground<\u002Fdiv>\n            <div style=\"font-family:'Saira',sans-serif;font-size:24px;font-weight:600;color:#E2F3FE\">Dark, layered<\u002Fdiv>\n            <p style=\"margin:0;color:#BACFE2\">Five surface containers from #19202E to #2B3750 carry hierarchy; the page ground is #0F121A.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#1D2535;padding:22px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Type<\u002Fdiv>\n            <div style=\"font-family:'Saira',sans-serif;font-size:24px;font-weight:600;color:#E2F3FE\">Saira / Hind Madurai<\u002Fdiv>\n            <p style=\"margin:0;color:#BACFE2\">Saira for display and headline, uppercase at the top of the scale. Hind Madurai for titles, body and labels.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#1D2535;padding:22px;display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Signal<\u002Fdiv>\n            <div style=\"font-family:'Saira',sans-serif;font-size:24px;font-weight:600;color:#E2F3FE\">One primary, five alerts<\u002Fdiv>\n            <p style=\"margin:0;color:#BACFE2\">#56BBFA is the only interactive fill. Alert 5 → 1 runs green, cyan, magenta, orange, red.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Palette at a glance<\u002Fdiv>\n          <div style=\"display:flex;height:64px;border:1px solid #223544\">\n            <sc-for list=\"{{ glance }}\" as=\"c\" hint-placeholder-count=\"12\">\n              <div style=\"flex:1;background:{{ c.hex }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_colors }}\">\n      <div style=\"display:flex;flex-direction:column;gap:40px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Foundations<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Colors<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Every role carries four slots: the base, the ink that sits on it, a container for tinted areas, and the ink for that container. Alert 5 is the calmest level, Alert 1 the most severe.<\u002Fp>\n        <\u002Fheader>\n\n        <section style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Roles<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#223544;border:1px solid #223544\">\n            <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"7\">\n              <div style=\"display:grid;grid-template-rows:90px 68px 76px 76px;gap:1px;min-width:0\">\n                <div style=\"background:{{ r.base }};color:{{ r.on }};padding:16px 12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden\">\n                  <span style=\"font-weight:600;font-size:13px\">{{ r.name }}<\u002Fspan>\n                  <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;opacity:.85\">{{ r.baseHex }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background:{{ r.on }};color:{{ r.base }};padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden\">\n                  <span style=\"font-size:12px\">On {{ r.name }}<\u002Fspan>\n                  <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;opacity:.85\">{{ r.onHex }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background:{{ r.container }};color:{{ r.onContainer }};padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden\">\n                  <span style=\"font-size:12px\">{{ r.name }} container<\u002Fspan>\n                  <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;opacity:.85\">{{ r.containerHex }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"background:{{ r.onContainer }};color:{{ r.container }};padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden\">\n                  <span style=\"font-size:12px;font-weight:500\">On container<\u002Fspan>\n                  <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;opacity:.9\">{{ r.onContainerHex }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Surfaces<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#223544;border:1px solid #223544\">\n            <sc-for list=\"{{ surfaces }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"background:{{ s.hex }};padding:18px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;color:#BACFE2\">\n                <span style=\"font-weight:500\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;color:#75A3CC\">{{ s.hex }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#223544;border:1px solid #223544\">\n            <sc-for list=\"{{ containers }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"background:{{ s.hex }};padding:16px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;color:#BACFE2\">\n                <span style=\"font-size:13px\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;color:#75A3CC\">{{ s.hex }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#223544;border:1px solid #223544\">\n            <sc-for list=\"{{ inks }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:{{ s.hex }};padding:14px;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;color:#142439\">\n                <span style=\"font-size:13px;font-weight:500\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em\">{{ s.hex }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Scales<\u002Fh2>\n          <p style=\"margin:0;max-width:680px;color:#BACFE2\">Sequential ramps for data visualisation. Scale Primary carries neutral quantities; Scale Alert carries severity-weighted quantities.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:1px\">\n              <sc-for list=\"{{ scalePrimary }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"flex:1;background:{{ c.hex }};color:#E2F3FE;padding:14px;font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;display:flex;flex-direction:column;gap:26px\"><span>{{ c.name }}<\u002Fspan><span style=\"opacity:.8\">{{ c.hex }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:1px\">\n              <sc-for list=\"{{ scaleAlert }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"flex:1;background:{{ c.hex }};color:#171B26;padding:14px;font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.08em;display:flex;flex-direction:column;gap:26px\"><span>{{ c.name }}<\u002Fspan><span style=\"opacity:.8\">{{ c.hex }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#1D2535;border:1px solid #223544;padding:24px;display:flex;flex-direction:column;gap:14px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#C3CFD9\">Rules<\u002Fh2>\n          <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:#BACFE2;max-width:760px\">\n            <li>Primary #56BBFA is the only saturated fill in the interface chrome. One primary action per view.<\u002Fli>\n            <li>Body copy sits on On Surface #BACFE2; reserve On Surface Highest #E2F3FE for headings and the active row.<\u002Fli>\n            <li>Alert bases are for indicators and small fills. For text on a dark ground use the base, never the container.<\u002Fli>\n            <li>Outline #75A3CC draws focused and selected edges; Outline Lowest #508BBF draws resting edges and rules.<\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_type }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Foundations<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Typography<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Saira carries display and headline; Hind Madurai carries title, body and label. Fifteen steps, no others.<\u002Fp>\n        <\u002Fheader>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px;align-items:baseline;padding:20px 0;border-bottom:1px solid #20293C\">\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <span style=\"font-family:'Saira',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">{{ t.name }}<\u002Fspan>\n                <span style=\"font-size:12px;color:#75A3CC\">{{ t.spec }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family:{{ t.family }};font-weight:{{ t.weight }};font-size:{{ t.size }}px;line-height:1.15;color:#E2F3FE;text-transform:{{ t.transform }};min-width:0;overflow-wrap:break-word\">{{ t.sample }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:#223544;border:1px solid #223544\">\n          <div style=\"background:#1D2535;padding:24px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Composition · finding<\u002Fdiv>\n            <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:24px;line-height:1.15;color:#E2F3FE\">Absence de cloisonnement sur les applications légitimement accessibles<\u002Fdiv>\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#75A3CC\">Observations<\u002Fdiv>\n            <p style=\"margin:0;color:#BACFE2;text-wrap:pretty\">Aucun contrôle d’accès n’est appliqué au niveau du dépôt : l’ensemble des utilisateurs peut accéder à l’ensemble des dépôts.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#1D2535;padding:24px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Rules<\u002Fdiv>\n            <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:#BACFE2\">\n              <li>Display and Headline are set in Saira, uppercase at Display sizes only.<\u002Fli>\n              <li>Line length caps at 72 characters for Body Large and Medium.<\u002Fli>\n              <li>Labels are Semi-Bold and never lowercase-only inside chips and flags.<\u002Fli>\n              <li>Numerals in tables and counters are tabular Saira for column alignment.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_layout }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Foundations<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Spacing &amp; grid<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">A 4px base step. Panels sit on a 12-column grid with a 24px gutter; the application shell is a 268px rail plus fluid content.<\u002Fp>\n        <\u002Fheader>\n        <section style=\"display:flex;flex-direction:column;gap:10px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Steps<\u002Fh2>\n          <sc-for list=\"{{ spacing }}\" as=\"s\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid;grid-template-columns:120px 90px 1fr;gap:20px;align-items:center;padding:8px 0;border-bottom:1px solid #20293C\">\n              <span style=\"font-family:'Saira',sans-serif;font-size:13px;letter-spacing:.06em;color:#C3CFD9\">{{ s.token }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#75A3CC\">{{ s.px }} px<\u002Fspan>\n              <div style=\"height:14px;width:{{ s.px }}px;background:#56BBFA\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <section style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Grid<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(12,1fr);gap:24px;background:#171B26;border:1px solid #223544;padding:24px\">\n            <sc-for list=\"{{ cols }}\" as=\"c\" hint-placeholder-count=\"12\">\n              <div style=\"height:120px;background:#213B5E;border-top:2px solid #56BBFA;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:'Saira',sans-serif;font-size:11px;color:#BACFE2\">{{ c.n }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:28px;flex-wrap:wrap;color:#75A3CC;font-size:12px\">\n            <span>Gutter 24px<\u002Fspan><span>Margin 56px<\u002Fspan><span>Rail 268px<\u002Fspan><span>Max content 1240px<\u002Fspan><span>Radius 6px panels · 4px flags · 999px chips<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:#223544;border:1px solid #223544\">\n          <sc-for list=\"{{ elevations }}\" as=\"e\" hint-placeholder-count=\"3\">\n            <div style=\"background:#171B26;padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start\">\n              <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">{{ e.name }}<\u002Fdiv>\n              <div style=\"width:100%;height:78px;background:#20293C;border:1px solid #2B3750;border-radius:6px;box-shadow:{{ e.shadow }}\"><\u002Fdiv>\n              <div style=\"font-size:12px;color:#BACFE2\">{{ e.use }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_icons }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Foundations<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Icons<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Thin-stroke line icons on a 24px box, 1.5px stroke, square caps rounded. Icons take On Surface by default and Primary when they carry an action.<\u002Fp>\n        <\u002Fheader>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px;background:#223544;border:1px solid #223544\">\n          <div style=\"background:#1D2535;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#BACFE2\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16\" y1=\"16\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg><span style=\"font-size:11px;color:#75A3CC\">search<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#1D2535;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#BACFE2\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v6c0 5-3.2 8-7 9-3.8-1-7-4-7-9V6z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;color:#75A3CC\">shield<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#1D2535;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:# "2.5\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n              <button type=\"button\" style=\"width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#BACFE2;border:0;border-radius:999px;cursor:pointer\" style-hover=\"background:#20293C;color:#E2F3FE\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n              <button type=\"button\" style=\"width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#BACFE2;border:1px solid #508BBF;border-radius:999px;cursor:pointer\" style-hover=\"background:#20293C\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"5\" cy=\"12\" r=\"1.4\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1.4\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1.4\"><\u002Fcircle><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <sc-for list=\"{{ segItems }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"background:{{ t.bg }};color:{{ t.fg }};border:1px solid {{ t.bd }};border-radius:6px;padding:9px 18px;font-family:'Saira',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_forms }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:colum bel<\u002Fspan>\n                <input type=\"text\" value=\"Input\" style=\"background:transparent;border:0;outline:none;color:#E2F3FE;font-size:14px;padding:0\">\n              <\u002Fspan>\n              <span style=\"font-size:11px;color:#75A3CC\">Focused<\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px\">\n              <span style=\"display:flex;align-items:flex-end;justify-content:space-between;background:#20293C;border:1px solid #DF2A2A;border-radius:4px;padding:7px 12px 8px;gap:8px\">\n                <span style=\"display:flex;flex-direction:column;gap:2px;flex:1\">\n                  <span style=\"font-size:11px;color:#DF2A2A\">Label<\u002Fspan>\n                  <input type=\"text\" value=\"Input\" style=\"background:transparent;border:0;outline:none;color:#E2F3FE;font-size:14px;padding:0;width:100%\">\n                <\u002Fspan>\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#DF2A2A\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M12 4l9 15H3z\"><\u002Fpath><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14\"><\u002Fline><line x1=\"12\" y1=\"16.5\" x2=\"12\" y2=\"16.6\"><\u002Fline><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"font-size:11px;color:#DF2A2A\">Assistive text<\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px;opacity:.5\">\n              <span style=\"display:flex;flex-direction:column;background:#2B3750;border:1px solid #2B3750;border-radius:4px;padding:7px 12px 8px;gap:2px\">\n                <span style=\"font-size:11px;color:#9CB6C9\">Label<\u002Fspan>\n                <span style=\"color:#9CB6C9;font-size:14px\">Input<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:11px;color:#75A3CC\">Disabled<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:20px;background:#171B26;border:1px solid #223544;padding:24px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Search, prefix, select<\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:12px;font-weight:600;color:#C3CFD9\">Label<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:10px;background:#20293C;border:1px solid #2B3750;border-radius:4px;padding:10px 12px\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9CB6C9\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16\" y1=\"16\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg>\n                <span style=\"border:1px solid #508BBF;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;color:#BACFE2;white-space:nowrap\">Label 1<\u002Fspan>\n                <input type=\"text\" placeholder=\"Rechercher ou sélectionner…\" style=\"flex:1;min-width:0;background:transparent;border:0;outline:none;color:#E2F3FE;font-size:14px\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9CB6C9\" stroke-width=\"1.5\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"font-size:11px;color:#75A3CC\">Assistive text<\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:12px;font-weight:600;color:#C3CFD9\">Filter 1<\u002Fspan>\n              <span style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;background:#20293C;border:1px solid #2B3750;border-radius:4px;padding:10px 12px\">\n                <span style=\"color:#9CB6C9;font-size:14px\">Rechercher ou sélectionner…<\u002Fspan>\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9CB6C9\" stroke-width=\"1.5\" stroke-linecap=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:5px\">\n              <span style=\"font-size:12px;font-weight:600;color:#C3CFD9\">Description<\u002Fspan>\n              <textarea rows=\"3\" style=\"background:#20293C;border:1px solid #2B3750;border-radius:4px;padding:10px 12px;color:#E2F3FE;font-size:14px;outline:none;resize:vertical\">Livrer un plan d’action pour remédier à l’alerte de dépassement KPI.<\u002Ftextarea>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:#223544;border:1px solid #223544\">\n          <div style=\"background:#171B26;padding:24px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Radio<\u002Fdiv>\n            <label style=\"display:flex;align-items:center;gap:10px;color:#BACFE2\"><input type=\"radio\" name=\"dsr\" checked=\"checked\" style=\"accent-color:#56BBFA;width:17px;height:17px\">Selected<\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;color:#BACFE2\"><input type=\"radio\" name=\"dsr\" style=\"accent-color:#56BBFA;width:17px;height:17px\">Unselected<\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;color:#75A3CC;opacity:.55\"><input type=\"radio\" name=\"dsr2\" disabled=\"disabled\" style=\"accent-color:#56BBFA;width:17px;height:17px\">Disabled<\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"background:#171B26;padding:24px;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Checkbox<\u002Fdiv>\n            <label style=\"display:flex;align-items:center;gap:10px;color:#BACFE2\"><input type=\"checkbox\" checked=\"checked\" style=\"accent-color:#56BBFA;width:17px;height:17px\">Checked<\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;color:#BACFE2\"><input type=\"checkbox\" style=\"accent-color:#56BBFA;width:17px;height:17px\">Unchecked<\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;color:#75A3CC;opacity:.55\"><input type=\"checkbox\" disabled=\"disabled\" style=\"accent-color:#56BBFA;width:17px;height:17px\">Disabled<\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"background:#171B26;padding:24px;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"font-family:'Saira',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#75A3CC\">Toggle<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleA }}\" style=\"display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#BACFE2;font-size:14px;cursor:pointer;padding:0\">\n              <span style=\"width:44px;height:24px;border-radius:999px;background:{{ tA.track }};display:inline-flex;align-items:center;padding:3px;justify-content:{{ tA.justify }}\"><span style=\"width:18px;height:18px;border-radius:999px;background:{{ tA.knob }}\"><\u002Fspan><\u002Fspan>\n              <span>{{ tA.label }}<\u002Fspan>\n            <\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleB }}\" style=\"display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#BACFE2;font-size:14px;cursor:pointer;padding:0\">\n              <span>{{ tB.label }}<\u002Fspan>\n              <span style=\"width:44px;height:24px;border-radius:999px;background:{{ tB.track }};display:inline-flex;align-items:center;padding:3px;justify-content:{{ tB.justify }}\"><span style=\"width:18px;height:18px;border-radius:999px;background:{{ tB.knob }}\"><\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_chips }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Components<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Chips<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Fully rounded, Label Medium, 32px high. Four kinds: assignee, filter, input and navigation. Selected chips fill with Primary Container and take a Primary border.<\u002Fp>\n        <\u002Fheader>\n\n        <section style=\"display:flex;flex-direction:column;gap:14px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Assignee · trier les tâches par personne<\u002Fh2>\n          <p style=\"margin:0;max-width:680px;color:#BACFE2\">The chip carries a 24px circular avatar and the person’s full name — first and last, never initials or a truncated surname. Clicking it filters the board to that person’s tasks; several chips can be active at once.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:18px;background:#171B26;border:1px solid #223544;padding:24px\">\n            <span style=\"font-size:12px;color:#75A3CC\">Click to filter<\u002Fspan>\n            <div style=\"d :16px;padding:16px 20px;border-bottom:1px solid #223544\">\n            <span style=\"font-family:'Saira',sans-serif;font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#E2F3FE\">Vulnérabilités<\u002Fspan>\n            <span style=\"display:flex;gap:10px;align-items:center\">\n              <span style=\"display:flex;align-items:center;gap:8px;background:#20293C;border:1px solid #2B3750;border-radius:4px;padding:7px 10px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9CB6C9\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"16\" y1=\"16\" x2=\"21\" y2=\"21\"><\u002Fline><\u002Fsvg><input type=\"text\" placeholder=\"Rechercher\" style=\"background:transparent;border:0;outline:none;color:#E2F3FE;font-size:13px;width:150px\"><\u002Fspan>\n              <button type=\"button\" style=\"display:inline-flex;align-items:center;gap:8px;background:transparent;color:#BACFE2;border:1px solid #508BBF;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer\" style-hover=\"background:#20293C;color:#E2F3FE\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M3 5h18l-7 8v6l-4 2v-8z\"><\u002Fpath><\u002Fsvg>Filtrer<\u002Fbutton>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <sc-raw-table style=\"width:100%;border-collapse:collapse\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"background:#242E42\">\n                <sc-raw-th style=\"text-align:left;padding:12px 20px;font-family:'Saira',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#9CB6C9\">Actif<\u002Fsc-raw-th>\n                <sc-raw-th style=\"text-align:left;padding:12px 20px;font-family:'Saira',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#
