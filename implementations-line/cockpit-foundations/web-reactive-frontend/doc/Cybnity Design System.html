#75A3CC;font-size:12px\">\n            <span>6 of 128<\u002Fspan>\n            <span style=\"display:flex;gap:8px\"><span style=\"border:1px solid #2B3750;border-radius:4px;padding:4px 10px;color:#BACFE2\">1<\u002Fspan><span style=\"border:1px solid #2B3750;border-radius:4px;padding:4px 10px\">2<\u002Fspan><span style=\"border:1px solid #2B3750;border-radius:4px;padding:4px 10px\">3<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_charts }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Components<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Charts<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Charts draw on Surface Container Lowest with hairline axes in Outline Lowest. Neutral series use Scale Primary; severity series use the alert bases in order.<\u002Fp>\n        <\u002Fheader>\n        <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px\">\n          <div style=\"background:#19202E;border:1px solid #223544;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px\">\n            <span style=\"font-family:'Saira',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9CB6C9\">Vulnérabilités par sévérité<\u002Fspan>\n            <div style=\"display:flex;align-items:flex-end;gap:18px;height:200px;border-bottom:1px solid #508BBF;padding-bottom:0\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%\">\n                  <span style=\"font-family:'Saira',sans-serif;font-size:13px;color:#E2F3FE\">{{ b.value }}<\u002Fspan>\n                  <div style=\"width:100%;height:{{ b.h }}px;background:{{ b.color }}\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:18px\">\n              <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                <span style=\"flex:1;text-align:center;font-size:11px;color:#75A3CC\">{{ b.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#19202E;border:1px solid #223544;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px\">\n            <span style=\"font-family:'Saira',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9CB6C9\">Alertes · 30 jours<\u002Fspan>\n            <svg sc-camel-view-box=\"0 0 320 180\" style=\"width:100%;height:auto\">\n              <line x1=\"0\" y1=\"150\" x2=\"320\" y2=\"150\" stroke=\"#508BBF\" stroke-width=\"1\"><\u002Fline>\n              <line x1=\"0\" y1=\"100\" x2=\"320\" y2=\"100\" stroke=\"#223544\" stroke-width=\"1\"><\u002Fline>\n              <line x1=\"0\" y1=\"50\" x2=\"320\" y2=\"50\" stroke=\"#223544\" stroke-width=\"1\"><\u002Fline>\n              <polyline points=\"0,132 40,118 80,124 120,86 160,96 200,58 240,70 280,40 320,52\" fill=\"none\" stroke=\"#56BBFA\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolyline>\n              <polyline points=\"0,144 40,140 80,132 120,136 160,120 200,124 240,110 280,116 320,104\" fill=\"none\" stroke=\"#D65C36\" stroke-width=\"2\" stroke-dasharray=\"4 4\" stroke-linejoin=\"round\"><\u002Fpolyline>\n              <circle cx=\"280\" cy=\"40\" r=\"3.5\" fill=\"#56BBFA\"><\u002Fcircle>\n            <\u002Fsvg>\n            <div style=\"display:flex;gap:20px;font-size:12px;color:#BACFE2\">\n              <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:#56BBFA\"><\u002Fspan>Détections<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:#D65C36\"><\u002Fspan>Incidents<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#19202E;border:1px solid #223544;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px\">\n            <span style=\"font-family:'Saira',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9CB6C9\">Couverture du périmètre<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:24px\">\n              <svg sc-camel-view-box=\"0 0 120 120\" style=\"width:130px;height:130px;flex:0 0 130px\">\n                <circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"#20293C\" stroke-width=\"16\"><\u002Fcircle>\n                <circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"#56BBFA\" stroke-width=\"16\" stroke-dasharray=\"216 289\" stroke-linecap=\"butt\" transform=\"rotate(-90 60 60)\"><\u002Fcircle>\n                <text x=\"60\" y=\"66\" text-anchor=\"middle\" fill=\"#E2F3FE\" font-family=\"Saira\" font-size=\"24\" font-weight=\"700\">75%<\u002Ftext>\n              <\u002Fsvg>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ donutLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n                  <span style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#BACFE2\"><span style=\"width:10px;height:10px;background:{{ l.color }}\"><\u002Fspan>{{ l.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#19202E;border:1px solid #223544;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:16px\">\n            <span style=\"font-family:'Saira',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9CB6C9\">Répartition · barres empilées<\u002Fspan>\n            <sc-for list=\"{{ stacks }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"display:flex;justify-content:space-between;font-size:12px;color:#BACFE2\"><span>{{ s.label }}<\u002Fspan><span style=\"font-family:'Saira',sans-serif;color:#E2F3FE\">{{ s.total }}<\u002Fspan><\u002Fspan>\n                <span style=\"display:flex;height:12px;width:100%;background:#20293C\">\n                  <sc-for list=\"{{ s.parts }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <span style=\"width:{{ p.w }}%;background:{{ p.color }}\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_alerts }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Components<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Alerts &amp; status<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Five levels, one per role in the alert ramp. Level 5 is nominal, level 1 demands immediate response. Flags are 4px squares; banners use the container fill with its own ink.<\u002Fp>\n        <\u002Fheader>\n\n        <section style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:#223544;border:1px solid #223544\">\n          <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div style=\"background:#171B26;padding:20px;display:flex;flex-direction:column;gap:14px\">\n              <span style=\"width:44px;height:44px;border-radius:4px;background:{{ l.base }};color:{{ l.on }};display:inline-flex;align-items:center;justify-content:center;font-family:'Saira',sans-serif;font-weight:700;font-size:20px\">{{ l.n }}<\u002Fspan>\n              <span style=\"font-family:'Saira',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#E2F3FE\">{{ l.name }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#9CB6C9\">{{ l.meaning }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Banners<\u002Fh2>\n          <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:flex-start;gap:14px;background:{{ l.container }};border-left:3px solid {{ l.base }};border-radius:4px;padding:14px 18px\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ l.base }}\" stroke-width=\"1.5\" stroke-linecap=\"round\" style=\"flex:0 0 20px;margin-top:1px\"><path d=\"M12 4l9 15H3z\"><\u002Fpath><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14\"><\u002Fline><line x1=\"12\" y1=\"16.5\" x2=\"12\" y2=\"16.6\"><\u002Fline><\u002Fsvg>\n              <span style=\"display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-weight:600;color:{{ l.onContainer }}\">{{ l.name }}<\u002Fspan>\n                <span style=\"font-size:13px;color:{{ l.onContainer }};opacity:.85\">{{ l.banner }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:12px\">\n          <h2 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#C3CFD9\">Flags<\u002Fh2>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;background:#171B26;border:1px solid #223544;padding:24px\">\n            <sc-for list=\"{{ flags }}\" as=\"f\" hint-placeholder-count=\"8\">\n              <span style=\"background:{{ f.bg }};color:{{ f.fg }};border:1px solid {{ f.bd }};border-radius:4px;padding:5px 12px;font-size:11px;font-weight:600;letter-spacing:.04em\">{{ f.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ s_overlays }}\">\n      <div style=\"display:flex;flex-direction:column;gap:36px\">\n        <header style=\"display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #223544;padding-bottom:22px\">\n          <div style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#75A3CC\">Components<\u002Fdiv>\n          <h1 style=\"margin:0;font-family:'Saira',sans-serif;font-weight:700;font-size:40px;line-height:1;color:#E2F3FE;text-transform:uppercase\">Modals &amp; overlays<\u002Fh1>\n          <p style=\"margin:6px 0 0;max-width:680px;color:#BACFE2\">Dialogs sit on Surface Container High at the top elevation over a 70% ground scrim. Tooltips are Surface Container Highest with Body Small.<\u002Fp>\n        <\u002Fheader>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n          <button type=\"button\" sc-camel-on-click=\"{{ openDialog }}\" style=\"background:#56BBFA;color:#142439;border:0;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#7FCCFC\">Open dialog<\u002Fbutton>\n          <span style=\"position:relative;display:inline-flex;align-items:center;gap:10px;color:#BACFE2;font-size:13px\">\n            <span style=\"border-bottom:1px dashed #508BBF;padding-bottom:2px\">Hover for tooltip<\u002Fspan>\n            <span style=\"background:#2B3750;color:#E2F3FE;border-radius:4px;padding:6px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)\">Supporting text<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"position:relative;height:420px;background:#0F121A;border:1px solid #223544;border-radius:6px;overflow:hidden\">\n          <div style=\"position:absolute;inset:0;padding:24px;opacity:.35;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"height:22px;width:40%;background:#20293C\"><\u002Fdiv>\n            <div style=\"height:12px;width:70%;background:#20293C\"><\u002Fdiv>\n            <div style=\"height:12px;width:60%;background:#20293C\"><\u002Fdiv>\n            <div style=\"flex:1;background:#19202E\"><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ dialogOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:absolute;inset:0;background:rgba(15,18,26,.72);display:flex;align-items:center;justify-content:center;padding:24px\">\n              <div style=\"width:100%;max-width:460px;background:#242E42;border:1px solid #2B3750;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:24px;display:flex;flex-direction:column;gap:16px\">\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n                  <span style=\"font-family:'Saira',sans-serif;font-weight:600;font-size:22px;line-height:1.2;color:#E2F3FE\">Confirmer la manœuvre défensive<\u002Fspan>\n                  <button type=\"button\" sc-camel-on-click=\"{{ closeDialog }}\" style=\"width:30px;height:30px;flex:0 0 30px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#BACFE2;border:1px solid #508BBF;border-radius:999px;cursor:pointer\" style-hover=\"background:#2B3750;color:#E2F3FE\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n                <\u002Fdiv>\n                <p style=\"margin:0;color:#BACFE2;text-wrap:pretty\">L’isolement de application_CRM_X25 coupera les accès utilisateurs pendant la remédiation. L’action est journalisée et notifiée au commandement.<\u002Fp>\n                <div style=\"display:flex;justify-content:flex-end;gap:12px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ closeDialog }}\" style=\"background:transparent;color:#BACFE2;border:1px solid #508BBF;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#2B3750;color:#E2F3FE\">Annuler<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ closeDialog }}\" style=\"background:#56BBFA;color:#142439;border:0;border-radius:6px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#7FCCFC\">Confirmer<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showHex&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Reference&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;comfortable&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Reference&quot;}}\">\nconst P = {\n  primary:'#56BBFA', onPrimary:'#142439', primaryC:'#213B5E', onPrimaryC:'#E2F3FE',\n  a5:'#5AC18F', a4:'#26A8C5', a3:'#C02FA9', a2:'#D65C36', a1:'#DF2A2A'\n};\n\nconst NAV = [\n  ['Start', [['overview','Overview']]],\n  ['Foundations', [['colors','Colors'],['type','Typography'],['layout','Spacing & grid'],['icons','Icons']]],\n  ['Components', [['buttons','Buttons'],['forms','Forms & inputs'],['chips','Chips'],['cards','Cards & panels'],['nav','Navigation'],['tables','Tables & data'],['charts','Charts'],['alerts','Alerts & status'],['overlays','Modals & overlays']]]\n];\n\nconst ROLES = [\n  ['Primary','#56BBFA','#142439','#213B5E','#E2F3FE'],\n  ['Secondary','#9CB6C9','#223544','#2E4252','#DEE5EB'],\n  ['Alert 5','#5AC18F','#22563D','#1A5A3B','#E1EAE1'],\n  ['Alert 4','#26A8C5','#0C4754','#125A69','#C9D9DD'],\n  ['Alert 3','#C02FA9','#46193F','#64285B','#D3C7D1'],\n  ['Alert 2','#D65C36','#601C06','#8F2F11','#F0E4DB'],\n  ['Alert 1','#DF2A2A','#600707','#901717','#F2D3D3']\n];\n\nconst LEVELS = [\n  [5,'Alert 5','#5AC18F','#22563D','#1A5A3B','#E1EAE1','Nominal','Situation nominale, supervision courante.'],\n  [4,'Alert 4','#26A8C5','#0C4754','#125A69','#C9D9DD','Vigilance','Signal faible confirmé, surveillance renforcée.'],\n  [3,'Alert 3','#C02FA9','#46193F','#64285B','#D3C7D1','Alerte','Incident ouvert, manœuvre défensive engagée.'],\n  [2,'Alert 2','#D65C36','#601C06','#8F2F11','#F0E4DB','Urgence','Impact opérationnel, réponse coordonnée.'],\n  [1,'Alert 1','#DF2A2A','#600707','#901717','#F2D3D3','Critique','Réponse immédiate, commandement notifié.']\n];\n\nconst TYPE = [\n  ['Display Large','Saira',700,57,'Saira · Bold · 57','uppercase'],\n  ['Display Medium','Saira',700,48,'Saira · Bold · 48','uppercase'],\n  ['Display Small','Saira',700,36,'Saira · Bold · 36','uppercase'],\n  ['Headline Large','Saira',600,32,'Saira · Semi-Bold · 32','none'],\n  ['Headline Medium','Saira',600,28,'Saira · Semi-Bold · 28','none'],\n  ['Headline Small','Saira',600,24,'Saira · Semi-Bold · 24','none'],\n  ['Title Large','Hind Madurai',500,22,'Hind Madurai · Medium · 22','none'],\n  ['Title Medium','Hind Madurai',500,16,'Hind Madurai · Medium · 16','none'],\n  ['Title Small','Hind Madurai',500,14,'Hind Madurai · Medium · 14','none'],\n  ['Body Large','Hind Madurai',400,16,'Hind Madurai · Regular · 16','none'],\n  ['Body Medium','Hind Madurai',400,14,'Hind Madurai · Regular · 14','none'],\n  ['Body Small','Hind Madurai',400,12,'Hind Madurai · Regular · 12','none'],\n  ['Label Large','Hind Madurai',600,14,'Hind Madurai · Semi-Bold · 14','none'],\n  ['Label Medium','Hind Madurai',600,12,'Hind Madurai · Semi-Bold · 12','none'],\n  ['Label Small','Hind Madurai',600,12,'Hind Madurai · Semi-Bold · 12','uppercase']\n];\n\nconst DOMAINS = ['Actifs & Périmètres','Acteurs & Responsabilités','Actions & Planification','Automatisations','Commandement','Coordinations','Comportements & Situations','Excellence Opérationnelle','Missions & Programmation','Manœuvres défensives','Normes & Conformités','Objectifs & Constatations','Risques & Menaces','Rétablissement opérationnel','Réponses défensives & Contrôles','Sensibilisation & Exercice','SMSI & Stratégie','Supervision des opérations','Tableau de bord & Indicateurs','Vulnérabilités'];\n\nclass Component extends DCLogic {\n  state = { section:'overview', seg:'ÉVÈNEMENTS', tab:'Acteurs & responsabilité', infocon:5, chips:{'Urgent':true}, assignees:{'Lori Petty':true}, tA:true, tB:false, dialog:true };\n\n  set(k, v) { this.setState({ [k]: v }); }\n\n  renderVals() {\n    const s = this.state.section;\n    const showHex = this.props.showHex ?? true;\n    const compact = (this.props.density ?? 'comfortable') === 'compact';\n\n    const navGroups = NAV.map(([name, items]) => ({\n      name,\n      items: items.map(([id, label]) => ({\n        id, label,\n        onClick: () => this.set('section', id),\n        bg: s === id ? '#213B5E' : 'transparent',\n        color: s === id ? '#E2F3FE' : '#BACFE2',\n        bar: s === id ? '#56BBFA' : 'transparent'\n      }))\n    }));\n\n    const roles = ROLES.map(([name, base, on, container, onContainer]) => ({\n      name, base, on, container, onContainer,\n      baseHex: showHex ? base : '', onHex: showHex ? on : '',\n      containerHex: showHex ? container : '', onContainerHex: showHex ? onContainer : ''\n    }));\n\n    const segItems = ['ÉVÈNEMENTS','ACTIONS','DÉFENSES'].map(label => ({\n      label,\n      onClick: () => this.set('seg', label),\n      bg: this.state.seg === label ? '#2B3750' : 'transparent',\n      fg: this.state.seg === label ? '#E2F3FE' : '#56BBFA',\n      bd: this.state.seg === label ? '#2B3750' : '#508BBF'\n    }));\n\n    const infoconTabs = LEVELS.map(([n, , base, on]) => ({\n      n, onClick: () => this.set('infocon', n),\n      bg: this.state.infocon === n ? '#242E42' : '#1D2535',\n      bd: this.state.infocon === n ? '#56BBFA' : '#223544',\n      fg: this.state.infocon === n ? '#E2F3FE' : '#BACFE2',\n      badge: base, badgeFg: on\n    }));\n\n    const topTabs = ['Acteurs & responsabilité','Risques & Menaces','Vulnérabilités'].map(label => ({\n      label, onClick: () => this.set('tab', label),\n      fg: this.state.tab === label ? '#E2F3FE' : '#9CB6C9',\n      bar: this.state.tab === label ? '#56BBFA' : 'transparent'\n    }));\n\n    const chipLabels = ['Urgent','Non commencé','En cours','Deadline < 48h','Assigné','Automatisé'];\n    const chips = chipLabels.map(label => {\n      const on = !!this.state.chips[label];\n      return {\n        label,\n        onClick: () => this.setState(st => ({ chips: Object.assign({}, st.chips, { [label]: !st.chips[label] }) })),\n        bg: on ? '#213B5E' : 'transparent',\n        fg: on ? '#E2F3FE' : '#BACFE2',\n        bd: on ? '#56BBFA' : '#508BBF'\n      };\n    });\n\n    const tg = v => ({ track: v ? '#56BBFA' : '#2B3750', knob: v ? '#142439' : '#E2F3FE', justify: v ? 'flex-end' : 'flex-start', label: v ? 'On' : 'Off' });\n\n    const tagFor = (label, color) => ({ label, bd: color, fg: color });\n    const taskCards = [\n      { title:'Remédiation KPI', when:'À l’instant', body:'Description ex : Livrer un plan d’action pour remédier à l’alerte de dépassement KPI sur application_CRM_X25',\n        tags:[tagFor('Urgent','#DF2A2A'), tagFor('Non commencé','#BACFE2'), tagFor('Deadline dans 2 jours','#BACFE2')] },\n      { title:'Cloisonnement dépôts', when:'il y a 5 jours', body:'Inventorier les applications légitimement accessibles par les utilisateurs standard et définir une matrice d’accès aux différentes données.',\n        tags:[tagFor('Non commencé','#BACFE2'), tagFor('Deadline dans 2 jours','#BACFE2')] }\n    ];\n\n    const listRows = [\n      ['Isolation réseau vérifiée','Supervision des opérations','#5AC18F'],\n      ['Revue d’accès GitHub','Acteurs & Responsabilités','#26A8C5'],\n      ['Dépassement KPI CRM_X25','Tableau de bord & Indicateurs','#D65C36'],\n      ['Exposition Confluence','Vulnérabilités','#DF2A2A'],\n      ['Exercice de crise T3','Sensibilisation & Exercice','#C02FA9']\n    ].map(([title, sub, dot]) => ({ title, sub, dot }));\n\n    const kpis = [\n      ['Actifs supervisés','1 284','+38 ce mois','#E2F3FE'],\n      ['Vulnérabilités','128','−12 en 7 jours','#D65C36'],\n      ['Incidents ouverts','6','2 critiques','#DF2A2A'],\n      ['Couverture','75%','objectif 90%','#56BBFA']\n    ].map(([label, value, delta, color]) => ({ label, value, delta, color }));\n\n    const sev = [['Critique','#901717','#F2D3D3'],['Urgence','#8F2F11','#F0E4DB'],['Alerte','#64285B','#D3C7D1'],['Vigilance','#125A69','#C9D9DD'],['Nominal','#1A5A3B','#E1EAE1']];\n    const tableRows = [\n      ['application_CRM_X25','Vulnérabilités',0,'Non commencé','J+2'],\n      ['depot_github_core','Acteurs & Responsabilités',1,'En cours','J+5'],\n      ['confluence_docs','Normes & Conformités',2,'En cours','J+9'],\n      ['vpn_edge_02','Manœuvres défensives',3,'Planifié','J+14'],\n      ['sso_directory','Risques & Menaces',3,'Planifié','J+21'],\n      ['backup_vault','Rétablissement opérationnel',4,'Clos','—']\n    ].map(([asset, domain, i, status, due]) => ({ asset, domain, status, due, sev: sev[i][0], sevBg: sev[i][1], sevFg: sev[i][2] }));\n\n    const barData = [['Critique',42,'#DF2A2A'],['Urgence',28,'#D65C36'],['Alerte',19,'#C02FA9'],['Vigilance',24,'#26A8C5'],['Nominal',15,'#5AC18F']];\n    const max = 48;\n    const bars = barData.map(([label, value, color]) => ({ label, value, color, h: Math.round((value / max) * 180) }));\n\n    const stacks = [\n      ['Actifs & Périmètres', 320, [[52,'#096BAD'],[28,'#0B5E97'],[20,'#0D5180']]],\n      ['Réponses défensives', 214, [[40,'#DF2A2A'],[35,'#D65C36'],[25,'#26A8C5']]],\n      ['Vulnérabilités', 128, [[33,'#DF2A2A'],[42,'#D65C36'],[25,'#5AC18F']]],\n      ['Conformités', 96, [[70,'#56BBFA'],[18,'#26A8C5'],[12,'#2B3750']]]\n    ].map(([label, total, parts]) => ({ label, total, parts: parts.map(([w, color]) => ({ w, color })) }));\n\n    const flags = [\n      ['Critique','#901717','#F2D3D3','#901717'],\n      ['Urgence','#8F2F11','#F0E4DB','#8F2F11'],\n      ['Alerte','#64285B','#D3C7D1','#64285B'],\n      ['Vigilance','#125A69','#C9D9DD','#125A69'],\n      ['Nominal','#1A5A3B','#E1EAE1','#1A5A3B'],\n      ['Non commencé','transparent','#BACFE2','#508BBF'],\n      ['En cours','#213B5E','#E2F3FE','#213B5E'],\n      ['Automatisé','transparent','#56BBFA','#56BBFA']\n    ].map(([label, bg, fg, bd]) => ({ label, bg, fg, bd }));\n\n    const people = [\n      ['Lori Petty','Analyste SOC','12 tâches'],\n      ['Peter Greenway','Responsable de projet','8 tâches'],\n      ['Amélie Rousseau','RSSI adjointe','5 tâches'],\n      ['Karim Benali','Développeur','3 tâches']\n    ];\n    const assignees = people.map(([name, role, count]) => {\n      const on = !!this.state.assignees[name];\n      return {\n        name, role, count,\n        onClick: () => this.setState(st => ({ assignees: Object.assign({}, st.assignees, { [name]: !st.assignees[name] }) })),\n        bg: on ? '#213B5E' : 'transparent',\n        fg: on ? '#E2F3FE' : '#BACFE2',\n        bd: on ? '#56BBFA' : '#508BBF',\n        avatarBg: on ? '#56BBFA' : '#2B3750',\n        avatarFg: on ? '#142439' : '#9CB6C9'\n      };\n    });\n    const selectedNames = people.map(p => p[0]).filter(n => this.state.assignees[n]);\n    const boardChips = selectedNames.map(name => ({\n      name,\n      onRemove: () => this.setState(st => ({ assignees: Object.assign({}, st.assignees, { [name]: false }) }))\n    }));\n\n    return {\n      pad: compact ? '32px 32px 72px' : '48px 56px 96px',\n      assignees, boardChips,\n      boardCount: selectedNames.length === 0 ? 'Toutes les tâches · 28' : selectedNames.length + ' personne(s) · ' + (selectedNames.length * 7) + ' tâches',\n      navGroups, roles, segItems, infoconTabs, topTabs, chips,\n      s_overview: s === 'overview', s_colors: s === 'colors', s_type: s === 'type',\n      s_layout: s === 'layout', s_icons: s === 'icons', s_buttons: s === 'buttons',\n      s_forms: s === 'forms', s_chips: s === 'chips', s_cards: s === 'cards', s_nav: s === 'nav',\n      s_tables: s === 'tables', s_charts: s === 'charts', s_alerts: s === 'alerts',\n      s_overlays: s === 'overlays',\n\n      glance: ['#0F121A','#171B26','#20293C','#2B3750','#508BBF','#75A3CC','#BACFE2','#56BBFA','#9CB6C9','#5AC18F','#26A8C5','#C02FA9','#D65C36','#DF2A2A'].map(hex => ({ hex })),\n      surfaces: [['Surface Dark','#0F121A'],['Surface','#171B26'],['Surface Bright','#1E263E']].map(([name, hex]) => ({ name, hex })),\n      containers: [['Container Lowest','#19202E'],['Container Low','#1D2535'],['Container','#20293C'],['Container High','#242E42'],['Container Highest','#2B3750']].map(([name, hex]) => ({ name, hex })),\n      inks: [['On Surface Highest','#C3CFD9'],['On Surface','#BACFE2'],['Outline','#75A3CC'],['Outline Lowest','#508BBF']].map(([name, hex]) => ({ name, hex })),\n      scalePrimary: ['#096BAD','#0A65A2','#0B5E97','#0C588B','#0D5180'].map((hex, i) => ({ hex, name: 'Scale Primary ' + (i + 1) })),\n      scaleAlert: ['#E1DCCC','#E3D5CA','#C2A8A8','#795252'].map((hex, i) => ({ hex, name: 'Scale Alert ' + (i + 1) })),\n\n      typeScale: TYPE.map(([name, family, weight, size, spec, transform]) => ({\n        name, family: \"'\" + family + \"', sans-serif\", weight, size, spec, transform,\n        sample: family === 'Saira' ? (size >= 36 ? 'Cybnity' : 'Cybnity Operations') : (size >= 16 ? 'Supervision des opérations' : 'Supervision des opérations défensives')\n      })),\n      spacing: [4,8,12,16,24,32,48,64].map((px, i) => ({ token: 'space-' + (i + 1), px })),\n      cols: Array.from({ length: 12 }, (_, i) => ({ n: i + 1 })),\n      elevations: [\n        { name:'Elevation 1', shadow:'0 1px 2px rgba(0,0,0,.4)', use:'Panels and cards at rest.' },\n        { name:'Elevation 2', shadow:'0 6px 18px rgba(0,0,0,.45)', use:'Menus, popovers, dropdowns.' },\n        { name:'Elevation 3', shadow:'0 24px 60px rgba(0,0,0,.55)', use:'Dialogs over the scrim.' }\n      ],\n      btnStates: [\n        { name:'Enabled', bg:'#56BBFA', fg:'#142439', border:'0', opacity:1, ring:'none' },\n        { name:'Hover', bg:'#7FCCFC', fg:'#142439', border:'0', opacity:1, ring:'none' },\n        { name:'Focus', bg:'#56BBFA', fg:'#142439', border:'0', opacity:1, ring:'0 0 0 2px #0F121A, 0 0 0 4px #56BBFA' },\n        { name:'Pressed', bg:'#38A9EC', fg:'#142439', border:'0', opacity:1, ring:'none' },\n        { name:'Disabled', bg:'#2B3750', fg:'#75A3CC', border:'0', opacity:.55, ring:'none' }\n      ],\n      toggleA: () => this.setState(st => ({ tA: !st.tA })),\n      toggleB: () => this.setState(st => ({ tB: !st.tB })),\n      tA: tg(this.state.tA), tB: tg(this.state.tB),\n      taskCards, listRows, kpis, tableRows, bars, stacks, flags,\n      donutLegend: [['Supervisé','#56BBFA'],['Partiel','#26A8C5'],['Hors périmètre','#20293C']].map(([label, color]) => ({ label, color })),\n      domains: DOMAINS.map(name => ({ name })),\n      steps: [['1','Constat',true],['2','Qualification',true],['3','Manœuvre',false],['4','Clôture',false]].map(([n, label, done]) => ({\n        n, label,\n        bg: done ? '#56BBFA' : 'transparent',\n        fg: done ? '#142439' : '#BACFE2',\n        bd: done ? '#56BBFA' : '#508BBF',\n        labelColor: done ? '#E2F3FE' : '#9CB6C9',\n        line: done ? '#56BBFA' : '#2B3750'\n      })),\n      levels: LEVELS.map(([n, name, base, on, container, onContainer, short, banner]) => ({\n        n, name: short, base, on, container, onContainer, banner,\n        meaning: name + ' · ' + base\n      })),\n      dialogOpen: this.state.dialog,\n      openDialog: () => this.set('dialog', true),\n      closeDialog: () => this.set('dialog', false)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
